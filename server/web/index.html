<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Tanks — WS test client</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 0; background: #111; color: #ddd; }
  header { padding: 10px 14px; background: #1b1b1b; border-bottom: 1px solid #333;
           display: flex; align-items: center; gap: 12px; }
  #status { font-weight: 600; }
  #status.up   { color: #6c6; }
  #status.down { color: #e66; }
  main { display: flex; flex-direction: column; height: calc(100vh - 52px); }
  #log { flex: 1; overflow-y: auto; padding: 10px 14px; margin: 0;
         white-space: pre-wrap; font-family: ui-monospace, monospace; }
  .sent { color: #7ab7ff; }
  .recv { color: #9ada7a; }
  .sys  { color: #888; }
  form { display: flex; gap: 8px; padding: 10px 14px; background: #1b1b1b;
         border-top: 1px solid #333; }
  input { flex: 1; padding: 8px; background: #222; color: #eee;
          border: 1px solid #444; border-radius: 4px; font-family: ui-monospace, monospace; }
  button { padding: 8px 16px; background: #2a6; color: #fff; border: 0;
           border-radius: 4px; cursor: pointer; }
  button:disabled { background: #444; cursor: default; }
</style>
</head>
<body>
<header>
  <span id="status" class="down">connecting…</span>
  <span class="sys">ws://localhost:8080/play</span>
</header>
<main>
  <div id="log"></div>
  <form id="form">
    <input id="msg" value='{"hello":"world"}' autocomplete="off" spellcheck="false">
    <button id="send" type="submit" disabled>Send</button>
  </form>
</main>

<script>
const logEl = document.getElementById("log");
const statusEl = document.getElementById("status");
const sendBtn = document.getElementById("send");
const form = document.getElementById("form");
const msgInput = document.getElementById("msg");

function log(text, cls) {
  const line = document.createElement("div");
  line.className = cls;
  line.textContent = new Date().toLocaleTimeString() + "  " + text;
  logEl.appendChild(line);
  logEl.scrollTop = logEl.scrollHeight;
}

let ws;
function connect() {
  ws = new WebSocket("ws://localhost:8080/play");

  ws.onopen = () => {
    statusEl.textContent = "connected";
    statusEl.className = "up";
    sendBtn.disabled = false;
    log("connected", "sys");
  };
  ws.onmessage = (e) => log("← " + e.data, "recv");
  ws.onclose = () => {
    statusEl.textContent = "disconnected — retrying…";
    statusEl.className = "down";
    sendBtn.disabled = true;
    log("disconnected", "sys");
    setTimeout(connect, 1000); // auto-reconnect so you can restart the server freely
  };
  ws.onerror = () => log("socket error", "sys");
}
connect();

form.addEventListener("submit", (e) => {
  e.preventDefault();
  if (ws.readyState !== WebSocket.OPEN) return;
  const text = msgInput.value;
  ws.send(text);
  log("→ " + text, "sent");
});
</script>
</body>
</html>
